{% extends "base.html" %}
{% block title %}Admin sign in · Daily arXiv{% endblock %}
{% block content %}
  <section class="panel login-panel"><h1>Admin sign in</h1><p class="section-note">Review suggestions, regenerate the preview, and send new papers to Slack.</p>
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Username</label><input id="username" name="username" value="admin" autocomplete="username" required>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="button" type="submit">Sign in →</button>
    </form>
    <p class="hint">Use the admin password printed in the container logs on first launch.</p>
  </section>
{% endblock %}
